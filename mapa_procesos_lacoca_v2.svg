<svg width="100%" viewBox="0 0 680 770" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Mapa de procesos – La Coca de Jacks</title>
  <desc>Mapa de procesos estilo SENA con tres niveles: procesos estratégicos, misionales y de soporte.</desc>
  <defs>
    <style>
      .clickable-process {
        cursor: pointer;
      }
      .clickable-process rect {
        transition: all 0.2s ease-in-out;
      }
      .clickable-process:hover rect {
        stroke: #c8205f !important;
        stroke-width: 1.5px !important;
        filter: drop-shadow(0 4px 10px rgba(200, 32, 95, 0.25)) !important;
      }
      .clickable-process.active rect {
        stroke: #f19f36 !important;
        stroke-width: 2px !important;
        filter: drop-shadow(0 4px 12px rgba(241, 159, 54, 0.4)) !important;
      }
      /* Remove pointer events on text/sub-elements to make group clicks robust */
      .clickable-process text, .clickable-process g {
        pointer-events: none;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ===== ENCABEZADO / BRANDING ===== -->
  <text x="60" y="38" font-weight="700" font-size="12" fill="#666666" font-family="'Outfit', sans-serif">TALLER SENA ADSO · FICHA 3312824</text>
  <text x="60" y="52" font-size="10" fill="#999999" font-family="'Outfit', sans-serif">PROYECTO JACKSOFT</text>

  <text x="340" y="38" text-anchor="middle" font-weight="800" font-size="20" fill="#c8205f" font-family="'Outfit', sans-serif" letter-spacing="0.5">LA COCA DE JACKS</text>
  <text x="340" y="54" text-anchor="middle" font-size="8.5" font-weight="600" fill="#f19f36" font-family="'Outfit', sans-serif" letter-spacing="1">TE COCINAMOS · EMPACAMOS · LLEVAMOS</text>

  <text x="620" y="38" text-anchor="end" font-weight="700" font-size="12" fill="#333333" font-family="'Outfit', sans-serif">Mapa de Procesos</text>
  <text x="620" y="52" text-anchor="end" font-size="10" fill="#f19f36" font-family="'Outfit', sans-serif">Medellín, Colombia</text>

  <!-- Accent top line -->
  <line x1="20" y1="75" x2="660" y2="75" stroke="#f19f36" stroke-width="2" stroke-linecap="round" />

  <!-- ===== CLIENTE: ENTRADA Y SALIDA (COLUMNAS LATERALES CON TEXTO COMPLETO) ===== -->
  <!-- Columna Izquierda: ENTRADAS -->
  <rect x="20" y="120" width="30" height="600" fill="#f19f36" rx="4" />
  <text x="35" y="420" text-anchor="middle" transform="rotate(-90 35 420)" fill="#ffffff" font-weight="700" font-size="7.2" font-family="'Outfit', sans-serif" letter-spacing="0.2">ENTRADAS · Necesidades y expectativas del cliente · Confirmación viernes · Pago verificado (Nequi) · Lista de clientes · Insumos de proveedores</text>

  <!-- Columna Derecha: SALIDAS -->
  <rect x="630" y="120" width="30" height="600" fill="#f19f36" rx="4" />
  <text x="645" y="420" text-anchor="middle" transform="rotate(90 645 420)" fill="#ffffff" font-weight="700" font-size="7.2" font-family="'Outfit', sans-serif" letter-spacing="0.2">SALIDAS · Satisfacción del cliente · Almuerzo entregado y cliente notificado · Recolección de envase vacío · Pedido semanal</text>


  <!-- ===== NIVEL 1: PROCESOS ESTRATÉGICOS (TOP CONTAINER) ===== -->
  <rect x="60" y="120" width="560" height="130" rx="6" fill="none" stroke="#f19f36" stroke-width="1.5" />
  <text x="70" y="112" font-weight="700" font-size="9" fill="#f19f36" font-family="'Outfit', sans-serif" letter-spacing="1">PROCESOS ESTRATÉGICOS</text>

  <!-- Proceso Inteligencia de Negocio -->
  <g id="proc-inteligencia" class="clickable-process" data-process="inteligencia">
    <rect x="80" y="135" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="155" y="165" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">INTELIGENCIA</text>
    <text x="155" y="179" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">DE NEGOCIO</text>
    <line x1="100" y1="193" x2="210" y2="193" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="155" y="210" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Churn · costo/plato · KPIs</text>
  </g>

  <!-- Proceso Gestión de Menús -->
  <g id="proc-menus" class="clickable-process" data-process="menus">
    <rect x="255" y="135" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="330" y="165" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">PLANIFICACIÓN Y</text>
    <text x="330" y="179" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">MENÚ SEMANAL</text>
    <line x1="275" y1="193" x2="385" y2="193" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="330" y="210" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Menús rotativos · Regla 3-1-1</text>
  </g>

  <!-- Proceso Gestión de Cupos -->
  <g id="proc-cupos" class="clickable-process" data-process="cupos">
    <rect x="430" y="135" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="505" y="165" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">CUPOS Y CAPACIDAD</text>
    <text x="505" y="179" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">OPERATIVA</text>
    <line x1="450" y1="193" x2="560" y2="193" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="505" y="210" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Cupos límite · Contratación</text>
  </g>


  <!-- ===== FLECHAS ESTRATÉGICAS HACIA MISIONALES ===== -->
  <!-- Flecha Izquierda -->
  <polygon points="180,250 260,250 260,265 275,265 220,295 165,265 180,265" fill="#ffffff" stroke="#c8205f" stroke-width="1.5" />
  <text x="220" y="259" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c8205f" font-family="'Outfit', sans-serif">MICROPROCESOS</text>
  <text x="220" y="269" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c8205f" font-family="'Outfit', sans-serif">ESTRATÉGICOS</text>

  <!-- Flecha Derecha -->
  <polygon points="420,250 500,250 500,265 515,265 460,295 405,265 420,265" fill="#ffffff" stroke="#c8205f" stroke-width="1.5" />
  <text x="460" y="259" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c8205f" font-family="'Outfit', sans-serif">MICROPROCESOS</text>
  <text x="460" y="269" text-anchor="middle" font-size="6.5" font-weight="700" fill="#c8205f" font-family="'Outfit', sans-serif">DE EVALUACIÓN</text>


  <!-- ===== NIVEL 2: PROCESOS MISIONALES / OPERATIVOS (CHEVRONS) ===== -->
  <text x="70" y="297" font-weight="700" font-size="9" fill="#c8205f" font-family="'Outfit', sans-serif" letter-spacing="1">PROCESOS MISIONALES / OPERATIVOS</text>

  <!-- Chevron 1: Comercialización y Ventas -->
  <g id="group-chevron-1">
    <path d="M 70 305 L 225 305 L 240 405 L 225 505 L 70 505 L 85 405 Z" fill="#ffffff" stroke="#c8205f" stroke-width="1.5" />
    
    <!-- Proceso Clientes y Captación -->
    <g id="proc-clientes" class="clickable-process" data-process="clientes">
      <rect x="90" y="315" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="125" y="323" width="60" height="14" rx="3" fill="#c62828" />
      <text x="155" y="333" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="155" y="352" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Clientes y Captación</text>
      <!-- Sub -->
      <text x="155" y="372" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Landing · WhatsApp · CRM</text>
    </g>

    <!-- Proceso Confirmación y Pago -->
    <g id="proc-confirmacion" class="clickable-process" data-process="confirmacion">
      <rect x="90" y="415" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="125" y="423" width="60" height="14" rx="3" fill="#c62828" />
      <text x="155" y="433" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="155" y="452" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Confirmación y Pago</text>
      <!-- Sub -->
      <text x="155" y="472" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Viernes 10 pm · Nequi</text>
    </g>
  </g>

  <!-- Chevron 2: Preparación y Cocina -->
  <g id="group-chevron-2">
    <path d="M 245 305 L 400 305 L 415 405 L 400 505 L 245 505 L 260 405 Z" fill="#ffffff" stroke="#c8205f" stroke-width="1.5" />

    <!-- Proceso Producción y Empaque -->
    <g id="proc-produccion" class="clickable-process" data-process="produccion">
      <rect x="265" y="315" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="300" y="323" width="60" height="14" rx="3" fill="#c62828" />
      <text x="330" y="333" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="330" y="352" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Producción y Empaque</text>
      <!-- Sub -->
      <text x="330" y="372" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Noche anterior · Cocas</text>
    </g>

    <!-- Proceso Entregas y Logística -->
    <g id="proc-entregas" class="clickable-process" data-process="entregas">
      <rect x="265" y="415" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="300" y="423" width="60" height="14" rx="3" fill="#c62828" />
      <text x="330" y="433" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="330" y="452" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Entregas y Logística</text>
      <!-- Sub -->
      <text x="330" y="472" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Moto · Ventana horaria</text>
    </g>
  </g>

  <!-- Chevron 3: Calidad y Post-Venta -->
  <g id="group-chevron-3">
    <path d="M 420 305 L 575 305 L 590 405 L 575 505 L 420 505 L 435 405 Z" fill="#ffffff" stroke="#c8205f" stroke-width="1.5" />

    <!-- Proceso Envases y Retorno -->
    <g id="proc-envases" class="clickable-process" data-process="envases">
      <rect x="440" y="315" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="475" y="323" width="60" height="14" rx="3" fill="#c62828" />
      <text x="505" y="333" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="505" y="352" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Envases y Retorno</text>
      <!-- Sub -->
      <text x="505" y="372" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Vidrio · Higienización</text>
    </g>

    <!-- Proceso Novedades y Servicio -->
    <g id="proc-novedades" class="clickable-process" data-process="novedades">
      <rect x="440" y="415" width="130" height="75" rx="6" fill="#fff9fa" stroke="#f5d6dd" stroke-width="1" />
      <!-- Label Box -->
      <rect x="475" y="423" width="60" height="14" rx="3" fill="#c62828" />
      <text x="505" y="433" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="6.5" font-family="'Outfit', sans-serif">MISIONAL</text>
      <!-- Title -->
      <text x="505" y="452" text-anchor="middle" fill="#c8205f" font-weight="700" font-size="9" font-family="'Outfit', sans-serif">Novedades y Servicio</text>
      <!-- Sub -->
      <text x="505" y="472" text-anchor="middle" fill="#555555" font-size="7" font-family="'Outfit', sans-serif">Incidencias · Soporte</text>
    </g>
  </g>


  <!-- ===== FLECHA DE APOYO DESDE SOPORTE ===== -->
  <polygon points="300,590 380,590 380,565 395,565 340,535 285,565 300,565" fill="#ffffff" stroke="#f19f36" stroke-width="1.5" />
  <text x="340" y="574" text-anchor="middle" font-size="6.5" font-weight="700" fill="#f19f36" font-family="'Outfit', sans-serif">MICROPROCESOS DE</text>
  <text x="340" y="584" text-anchor="middle" font-size="6.5" font-weight="700" fill="#f19f36" font-family="'Outfit', sans-serif">APOYO</text>


  <!-- ===== NIVEL 3: PROCESOS DE SOPORTE / APOYO (BOTTOM CONTAINER) ===== -->
  <rect x="60" y="590" width="560" height="130" rx="6" fill="none" stroke="#f19f36" stroke-width="1.5" />
  <text x="70" y="732" font-weight="700" font-size="9" fill="#f19f36" font-family="'Outfit', sans-serif" letter-spacing="1">PROCESOS DE SOPORTE / APOYO</text>

  <!-- Proceso Gestión Financiera -->
  <g id="proc-financiera" class="clickable-process" data-process="financiera">
    <rect x="80" y="605" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="155" y="640" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">GESTIÓN FINANCIERA</text>
    <text x="155" y="654" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">Y COMPRAS</text>
    <line x1="100" y1="668" x2="210" y2="668" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="155" y="683" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Caja · Central Mayorista</text>
  </g>

  <!-- Proceso Gestión de Comunicaciones -->
  <g id="proc-comunicaciones" class="clickable-process" data-process="comunicaciones">
    <rect x="255" y="605" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="330" y="640" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">COMUNICACIONES Y</text>
    <text x="330" y="654" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">NOTIFICACIONES</text>
    <line x1="275" y1="668" x2="385" y2="668" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="330" y="683" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Grupos de difusión · Alertas</text>
  </g>

  <!-- Proceso Evaluación y Mejora -->
  <g id="proc-evaluacion" class="clickable-process" data-process="evaluacion">
    <rect x="430" y="605" width="150" height="100" rx="6" fill="#c8205f" />
    <text x="505" y="640" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">EVALUACIÓN Y</text>
    <text x="505" y="654" text-anchor="middle" fill="#ffffff" font-weight="700" font-size="10.5" font-family="'Outfit', sans-serif">MEJORA CONTINUA</text>
    <line x1="450" y1="668" x2="560" y2="668" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="505" y="683" text-anchor="middle" fill="#ffccd5" font-size="7.5" font-family="'Outfit', sans-serif">Auditoría · Tiempos · Merma</text>
  </g>


  <!-- ===== PIE DE PÁGINA ===== -->
  <line x1="20" y1="730" x2="660" y2="730" stroke="#eeeeee" stroke-width="1" />
  <text x="340" y="752" text-anchor="middle" fill="#999999" font-size="9" font-family="'Outfit', sans-serif">Calle 28a #65a-24, Medellín · WhatsApp: 311 643 7887 · lacocadejacksmed@gmail.com</text>
</svg>